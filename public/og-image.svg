<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Deep Obsidian Background -->
  <rect width="1200" height="630" fill="#000000"/>
  
  <!-- Subtle Grid Overlay -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="20%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(0, 255, 136, 0.25)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Content Container -->
  <g transform="translate(100, 140)">
    <!-- Status Badge -->
    <rect x="0" y="0" width="430" height="42" rx="21" fill="rgba(0, 255, 136, 0.08)" stroke="rgba(0, 255, 136, 0.4)" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="6" fill="#00ff88"/>
    <text x="42" y="26" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#00ff88">Co-Founder &amp; Lead Engineer at DocTech Global</text>

    <!-- Main Title -->
    <text x="0" y="120" font-family="Inter, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-2">Abdulrahman Bakare.</text>
    <text x="0" y="185" font-family="Inter, sans-serif" font-size="44" font-weight="700" fill="#a1a1aa" letter-spacing="-1">Building High-Fidelity Software Systems.</text>

    <!-- Subtitle Bio -->
    <text x="0" y="245" font-family="Inter, sans-serif" font-size="22" font-weight="400" fill="#71717a">Founder &amp; CEO of MedAxis &amp; TechCircle • Computer Engineering @ LASU</text>

    <!-- Ventures Row -->
    <g transform="translate(0, 290)">
      <rect x="0" y="0" width="180" height="38" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.15)"/>
      <text x="18" y="24" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#ffffff">DocTech Global</text>

      <rect x="195" y="0" width="140" height="38" rx="8" fill="rgba(0, 255, 136, 0.1)" stroke="rgba(0, 255, 136, 0.3)"/>
      <text x="213" y="24" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#00ff88">MedAxis</text>

      <rect x="350" y="0" width="150" height="38" rx="8" fill="rgba(97, 218, 251, 0.1)" stroke="rgba(97, 218, 251, 0.3)"/>
      <text x="368" y="24" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#61dafb">TechCircle</text>
    </g>

    <!-- Domain Branding Footer -->
    <text x="0" y="380" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#ffffff">Abdurrahman<tspan fill="#00ff88">.Dev</tspan></text>
  </g>
</svg>
